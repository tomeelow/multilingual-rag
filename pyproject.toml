[project]
name = "multilingual-rag"
version = "0.1.0"
description = "Multilingual RAG assistant for EU/PL/UA AI-regulation and data-protection law"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ingestion
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "lingua-language-detector>=2.0",
    # chunking
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.8",
    # retrieval
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "bm25s>=0.2",
    # generation
    "openai>=1.55",
    "anthropic>=0.40",
    # api
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
    # frontend
    "streamlit>=1.40",
    "httpx>=0.27",
    # evaluation
    "ragas>=0.2",
    "langchain-openai>=0.2",
    # shared
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
