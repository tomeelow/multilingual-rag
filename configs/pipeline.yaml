# Pipeline parameters. Secrets and deployment endpoints live in .env;
# everything tunable about retrieval quality lives here.

embedding:
  model: intfloat/multilingual-e5-large   # pinned per ADR-2; changing it requires full re-embed
  dimensions: 1024

chunking:
  child_tokens: 256        # dense-retrieval granularity
  child_overlap: 32
  parent_max_tokens: 1024  # context granularity passed to the LLM
  tokenizer: cl100k_base

retrieval:
  candidates_k: 20         # per-leg candidates before fusion
  rrf_k: 60                # RRF rank constant
  final_k: 5               # chunks passed to the LLM after reranking
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2

index:
  collection: legal_docs
  version: 1               # bump whenever chunking or embedding config changes

generation:
  max_tokens: 1024
  temperature: 0.0
